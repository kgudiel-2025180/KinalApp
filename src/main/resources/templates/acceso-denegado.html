<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Acceso Denegado - KinalApp</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
</head>
<body class="bg-light">
<div class="container text-center mt-5">
    <div class="card shadow p-5 mx-auto" style="max-width: 500px;">
        <i class="bi bi-shield-lock text-danger" style="font-size: 5rem;"></i>
        <h1 class="text-danger mt-3">403</h1>
        <h4>Acceso Denegado</h4>
        <p class="text-muted">No tienes permisos para acceder a esta página.</p>

        <!-- Botón dinámico según el rol -->
        <div class="mt-4">
            <a sec:authorize="hasRole('ADMIN')" th:href="@{/web/dashboard}"
               class="btn btn-primary">
                <i class="bi bi-speedometer2"></i> Volver al Dashboard
            </a>
            <a sec:authorize="hasRole('VENDEDOR')" th:href="@{/web/dashboard}"
               class="btn btn-primary">
                <i class="bi bi-speedometer2"></i> Volver al Dashboard
            </a>
            <a sec:authorize="hasRole('CLIENTE')" th:href="@{/web/productos}"
               class="btn btn-success">
                <i class="bi bi-box-seam"></i> Volver a Productos
            </a>
        </div>

        <hr class="my-4">

        <a th:href="@{/logout}" class="btn btn-outline-danger btn-sm">
            <i class="bi bi-box-arrow-right"></i> Cerrar Sesión
        </a>
    </div>
</div>
</body>
</html>
